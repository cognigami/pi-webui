<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAI · Conversations</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<main id="app">
<header>
<button id="sessions-button" class="icon-button" aria-label="Sessions" title="Sessions" aria-controls="sessions" aria-expanded="false">☰</button>
<div class="heading"><h1 id="recipient">Choose a session</h1><p id="recipient-context" hidden></p><p id="activity">No session selected</p></div>
<button id="view-button" class="icon-button" aria-label="View options" title="View options" aria-controls="view-menu" aria-expanded="false"><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
</header>
<nav id="view-menu" hidden aria-label="Conversation view">
<button data-bulk="tools:true">Expand all tools</button><button data-bulk="tools:false">Collapse all tools</button>
<button data-bulk="thinking:true">Expand all thinking</button><button data-bulk="thinking:false">Collapse all thinking</button>
<button id="records-button" aria-pressed="false">Show session records</button>
<button id="rename-button" disabled>Rename tab</button>
</nav>
<div id="connection" role="status" hidden></div>
<div id="conversation-notice" role="status" hidden></div>
<section id="history" aria-label="Conversation" tabindex="0">
<button id="older" hidden>Load older messages</button>
<p id="history-health">Choose a running Pi session to catch up.</p>
<div id="messages"></div>
<div id="provisional" aria-label="Ongoing output"></div>
<div id="outgoing" aria-label="Outgoing messages"></div>
</section>
<button id="latest" hidden>New content below · Go to latest</button>
<footer>
<div id="feedback"></div>
<section id="composer" hidden aria-label="Message composer">
<label for="draft" class="sr-only">Message</label>
<textarea id="draft" rows="1" placeholder="Message…" spellcheck="true"></textarea>
<p id="draft-error" class="error" role="status"></p>
</section>
<div class="footer-actions">
<button id="stop-button" disabled>Stop</button><button id="send-button" disabled>Send</button>
</div>
</footer>
<dialog id="sessions" aria-labelledby="sessions-title">
<div class="dialog-heading"><button id="sessions-close" class="icon-button" aria-label="Close sessions" title="Close sessions" autofocus><svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button><h2 id="sessions-title">Sessions</h2></div>
<p id="session-summary" role="status">Looking for connected sessions…</p>
<div id="session-list"></div>
</dialog>
<dialog id="rename" aria-labelledby="rename-title">
<form id="rename-form">
<h2 id="rename-title">Rename tab</h2>
<label for="rename-name">Tab name</label>
<input id="rename-name" name="name" type="text" required maxlength="256" autocomplete="off" autofocus>
<p id="rename-error" class="error" role="status"></p>
<div class="footer-actions"><button id="rename-cancel" type="button">Cancel</button><button id="rename-save" type="submit">Save</button></div>
</form>
</dialog>
<div id="announcements" class="sr-only" aria-live="polite"></div>
</main>
</body>
</html>
